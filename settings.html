<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>設定 · SpinEat</title>
  <meta name="theme-color" content="#dcc58a">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="今天吃甚麼">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="awning" aria-hidden="true"></div>

  <main class="app">
    <header class="app-header">
      <h1 class="greeting">設定</h1>
      <div class="header-side">
        <span class="brand">SpinEat</span>
      </div>
    </header>

    <!-- 外觀 -->
    <section class="panel" aria-labelledby="appearance-title">
      <div class="panel-head">
        <h2 id="appearance-title">外觀</h2>
      </div>
      <div class="theme-options" id="theme-options" role="radiogroup" aria-labelledby="appearance-title">
        <label class="theme-option">
          <input type="radio" name="appearance" value="auto">
          <span class="theme-swatch theme-swatch-auto" aria-hidden="true"><i></i><i></i></span>
          <span class="theme-text"><strong>依時間自動</strong><small id="auto-hint">白天冰果室，晚上夜市霓虹</small></span>
        </label>
        <label class="theme-option">
          <input type="radio" name="appearance" value="icefruit">
          <span class="theme-swatch theme-swatch-icefruit" aria-hidden="true"><i></i></span>
          <span class="theme-text"><strong>老派冰果室</strong><small>芥末黃磁磚、孔雀綠檯面</small></span>
        </label>
        <label class="theme-option">
          <input type="radio" name="appearance" value="neon">
          <span class="theme-swatch theme-swatch-neon" aria-hidden="true"><i></i></span>
          <span class="theme-text"><strong>夜市霓虹</strong><small>靛紫夜色、桃紅釘子</small></span>
        </label>
      </div>
    </section>

    <!-- 店家 -->
    <section class="panel" aria-labelledby="stores-title">
      <div class="panel-head">
        <h2 id="stores-title">我的店家</h2>
        <button type="button" class="btn-primary btn-sm" id="add-store-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新增店家</button>
      </div>
      <ul class="store-list" id="store-list"></ul>
    </section>

    <!-- 標籤 -->
    <section class="panel" aria-labelledby="tags-title">
      <div class="panel-head">
        <h2 id="tags-title">分類標籤</h2>
      </div>
      <form class="inline-form" id="tag-form">
        <label class="visually-hidden" for="tag-input">新標籤名稱</label>
        <input type="text" id="tag-input" placeholder="例如：公司附近、可外送" maxlength="12" autocomplete="off">
        <button type="submit" class="btn-secondary btn-sm">新增</button>
      </form>
      <ul class="tag-list" id="tag-list"></ul>
    </section>

    <!-- 備份 -->
    <section class="panel" aria-labelledby="backup-title">
      <div class="panel-head">
        <h2 id="backup-title">資料備份</h2>
      </div>
      <p class="panel-note">資料只存在這個瀏覽器裡，清除瀏覽資料就會消失。建議定期匯出備份，也可以用來把資料搬到另一台裝置。</p>
      <div class="backup-actions">
        <button type="button" class="btn-secondary btn-sm" id="export-btn">匯出 JSON</button>
        <label class="btn-secondary btn-sm file-btn">
          匯入 JSON
          <input type="file" id="import-input" accept="application/json,.json">
        </label>
      </div>
    </section>
  </main>

  <!-- 店家編輯表單 -->
  <dialog class="store-dialog" id="store-dialog" aria-labelledby="store-dialog-title">
    <form id="store-form" novalidate>
      <h2 id="store-dialog-title">新增店家</h2>

      <label class="field">
        <span>名稱 <em>*</em></span>
        <input type="text" name="name" maxlength="30" required autocomplete="off">
      </label>

      <label class="field">
        <span>地址</span>
        <input type="text" name="address" maxlength="100" autocomplete="off" placeholder="可留空，用來開啟 Google 地圖">
      </label>

      <fieldset class="field">
        <legend>餐別 <em>*</em></legend>
        <div class="chips" id="form-meals"></div>
      </fieldset>

      <fieldset class="field">
        <legend>預算</legend>
        <div class="chips" id="form-price"></div>
      </fieldset>

      <fieldset class="field">
        <legend>分類標籤</legend>
        <div class="chips" id="form-tags"></div>
      </fieldset>

      <label class="switch-row">
        <input type="checkbox" name="enabled" checked>
        <span>啟用（關閉後不會出現在彈珠台上）</span>
      </label>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <div class="dialog-actions">
        <button type="button" class="btn-secondary" id="cancel-store-btn">取消</button>
        <button type="submit" class="btn-primary">儲存</button>
      </div>
    </form>
  </dialog>

  <nav class="bottom-nav" aria-label="主要頁面">
    <a href="index.html">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="9" cy="8" r=".6"/><circle cx="15" cy="8" r=".6"/><circle cx="12" cy="11.5" r=".6"/><path d="M8 21v-4M12 21v-4M16 21v-4"/></svg>
      <span>抽選</span>
    </a>
    <a href="settings.html" aria-current="page">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>設定</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="js/foods.js"></script>
  <script src="js/store.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
