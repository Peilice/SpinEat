<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SpinEat · 今天吃甚麼</title>
  <meta name="description" content="選擇困難？轉一下，幫你決定今天吃甚麼。">
  <meta name="theme-color" content="#8c2216">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="今天吃甚麼">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261027k">
  <script src="js/theme.js?v=20261027k"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="awning" aria-hidden="true"></div>

  <main class="app">
    <header class="app-header">
      <h1 class="greeting" id="greeting">今天吃什麼？</h1>
      <div class="header-side">
        <span class="brand">SpinEat</span>
      </div>
    </header>

    <div class="mode-tabs" role="radiogroup" aria-label="抽選來源" id="mode-switch">
      <button type="button" role="radio" data-mode="food">料理</button>
      <button type="button" role="radio" data-mode="store">我的店家</button>
    </div>

    <details class="filters" id="filters">
      <summary>
        <span class="filter-summary" id="filter-summary"></span>
        <span class="filter-edit"><span class="visually-hidden">調整條件</span>
          <svg class="icon chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </span>
      </summary>
      <div class="filter-panel" aria-label="篩選條件">
        <div class="filter-row">
          <span class="filter-label">餐別</span>
          <div class="chips" id="meal-chips" role="radiogroup" aria-label="餐別"></div>
        </div>
        <div class="filter-row">
          <span class="filter-label">預算</span>
          <div class="chips" id="price-chips" role="group" aria-label="預算"></div>
        </div>
        <div class="filter-row">
          <span class="filter-label" id="type-label">類型</span>
          <div class="chips" id="type-chips" role="group" aria-labelledby="type-label"></div>
        </div>
        <div class="filter-row">
          <label class="exclude-toggle">
            <input type="checkbox" id="exclude-recent" checked>
            排除最近
            <select id="exclude-days" aria-label="排除天數">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="5">5</option>
              <option value="7">7</option>
            </select>
            天吃過的
          </label>
        </div>
      </div>
    </details>

    <section class="board-area" aria-label="抽選" id="board-area">
      <div class="board-wrap">
        <div class="poke-sheet" id="poke" role="img" aria-label="戳戳樂" hidden>
          <div class="poke-head" aria-hidden="true">
            <span class="poke-title">戳戳樂</span>
            <span class="poke-sub">挑一格戳下去</span>
          </div>
          <div class="poke-grid" aria-hidden="true"></div>
        </div>
        <div class="temple" id="temple" role="img" aria-label="籤筒" hidden>
          <p class="temple-plaque" aria-hidden="true">有求必應</p>
          <p class="qian-slot" aria-hidden="true">點籤筒求一支籤</p>
          <svg class="tube" viewBox="0 0 120 220" aria-hidden="true">
            <g class="tube-sticks"></g>
            <ellipse class="tube-rim" cx="60" cy="82" rx="42" ry="9"/>
            <rect class="tube-body" x="18" y="82" width="84" height="130" rx="10"/>
            <rect class="tube-band" x="18" y="98" width="84" height="7"/>
            <rect class="tube-band" x="18" y="190" width="84" height="7"/>
            <text class="tube-word" x="60" y="160" text-anchor="middle">籤</text>
          </svg>
          <div class="qian" aria-hidden="true" hidden>
            <span class="qian-no"></span>
            <span class="qian-name"></span>
          </div>
        </div>
        <div class="board-empty" id="board-empty" hidden>
          <p id="board-empty-text"></p>
          <a class="btn-secondary btn-sm" href="settings.html" id="board-empty-link" hidden>前往設定新增店家</a>
          <button type="button" class="btn-secondary btn-sm" id="board-empty-action" hidden></button>
        </div>
      </div>
      <p class="candidate-count" id="candidate-count"></p>
      <button class="go-btn" id="spin-btn" type="button">幫我決定！</button>
    </section>

    <section class="week-area" aria-labelledby="week-title">
      <div class="week-head">
        <h2 id="week-title">這七天</h2>
        <span class="week-legend" id="week-legend"></span>
      </div>
      <ol class="week" id="week"></ol>
      <details class="history">
        <summary>全部紀錄 <span id="history-count"></span></summary>
        <ul class="history-list" id="history-list"></ul>
        <button type="button" class="btn-text btn-danger" id="clear-history">清除所有紀錄</button>
      </details>
    </section>
  </main>

  <dialog class="result" id="result" aria-labelledby="result-name">
    <div class="result-inner">
      <div class="result-top">
        <p class="result-place" id="result-place"></p>
        <button type="button" class="btn-text result-close" id="close-result">返回</button>
      </div>
      <ol class="lane" id="result-lane" aria-hidden="true"></ol>
      <div class="result-body">
        <h2 class="result-name" id="result-name"></h2>
        <p class="result-meta" id="result-meta"></p>
        <p class="result-why" id="result-why"></p>
        <a class="result-map" id="result-map" target="_blank" rel="noopener" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <span id="result-map-text"></span>
        </a>
      </div>
      <div class="result-actions">
        <button type="button" class="btn-primary" id="accept-btn">就吃這個</button>
        <button type="button" class="btn-secondary" id="respin-btn">再抽一次</button>
      </div>
    </div>
  </dialog>

  <nav class="bottom-nav" aria-label="主要頁面">
    <a href="index.html" aria-current="page">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="9" cy="8" r=".6"/><circle cx="15" cy="8" r=".6"/><circle cx="12" cy="11.5" r=".6"/><path d="M8 21v-4M12 21v-4M16 21v-4"/></svg>
      <span>抽選</span>
    </a>
    <a href="settings.html">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>設定</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="js/foods.js?v=20261027k"></script>
  <script src="js/store.js?v=20261027k"></script>
  <script src="js/fortune.js?v=20261027k"></script>
  <script src="js/poke.js?v=20261027k"></script>
  <script src="js/app.js?v=20261027k"></script>
</body>
</html>
